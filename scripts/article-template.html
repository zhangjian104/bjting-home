<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - 白洁听书</title>
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://bjting.com/article/{{slug}}">
    <meta property="og:image" content="{{cover}}">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --content-max-width: 820px;
            --sidebar-width: 300px;
            --gap: 24px;
            --header-height: 56px;
            --color-bg: #f4f5f5;
            --color-bg-card: #ffffff;
            --color-border: #e4e6eb;
            --color-text: #252933;
            --color-text-secondary: #8a919f;
            --color-text-tertiary: #c2c8d1;
            --color-primary: #1e80ff;
            --color-primary-light: #e8f3ff;
            --color-heading: #1d2129;
            --color-link: #1e80ff;
            --color-blockquote-bg: #f7f8fa;
            --color-blockquote-border: #1e80ff;
            --color-code-bg: #f1f2f3;
            --radius: 8px;
            --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                         "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 顶部导航 ── */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-height);
            background: var(--color-bg-card);
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .site-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 600;
            color: var(--color-heading);
            text-decoration: none;
        }

        .site-header .logo img {
            height: 28px;
            width: 28px;
            border-radius: 6px;
        }

        .site-header .back-link {
            margin-left: auto;
            font-size: 14px;
            color: var(--color-text-secondary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .site-header .back-link:hover {
            color: var(--color-primary);
            background: var(--color-primary-light);
        }

        /* ── 两栏布局 ── */
        .page-container {
            max-width: calc(var(--content-max-width) + var(--sidebar-width) + var(--gap));
            margin: 20px auto 40px;
            padding: 0 16px;
            display: flex;
            gap: var(--gap);
            align-items: flex-start;
        }

        /* ── 文章主体（卡片） ── */
        .article-main {
            flex: 1;
            min-width: 0;
            max-width: var(--content-max-width);
            background: var(--color-bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 32px 32px 40px;
        }

        .article-meta {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--color-border);
        }

        .article-meta h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--color-heading);
            margin-bottom: 14px;
            letter-spacing: -0.2px;
        }

        .article-meta .meta-info {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .article-meta .meta-info .tag {
            display: inline-block;
            padding: 2px 12px;
            background: var(--color-primary-light);
            border-radius: 14px;
            font-size: 12px;
            color: var(--color-primary);
            font-weight: 500;
        }

        /* ── 文章正文排版 ── */
        .article-content {
            font-size: 16px;
            color: var(--color-text);
            line-height: 1.8;
            word-break: break-word;
        }

        .article-content h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-heading);
            margin: 32px 0 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }

        .article-content h2 {
            font-size: 21px;
            font-weight: 700;
            color: var(--color-heading);
            margin: 28px 0 14px;
            padding-left: 12px;
            border-left: 4px solid var(--color-primary);
        }

        .article-content h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-heading);
            margin: 24px 0 12px;
        }

        .article-content h4, .article-content h5, .article-content h6 {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-heading);
            margin: 20px 0 10px;
        }

        .article-content p {
            margin: 0 0 16px;
        }

        .article-content a {
            color: var(--color-link);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .article-content a:hover {
            border-bottom-color: var(--color-link);
        }

        .article-content strong {
            font-weight: 600;
            color: var(--color-heading);
        }

        .article-content img {
            max-width: 100%;
            display: block;
            margin: 20px auto;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .article-content blockquote {
            margin: 16px 0;
            padding: 12px 16px 12px 20px;
            background: var(--color-blockquote-bg);
            border-left: 4px solid var(--color-blockquote-border);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--color-text-secondary);
            font-size: 15px;
        }

        .article-content blockquote p {
            margin: 0;
        }

        .article-content ul, .article-content ol {
            margin: 0 0 16px;
            padding-left: 24px;
        }

        .article-content li {
            margin-bottom: 6px;
        }

        .article-content li::marker {
            color: var(--color-primary);
        }

        .article-content code {
            font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
            font-size: 0.9em;
            padding: 2px 6px;
            background: var(--color-code-bg);
            border-radius: 4px;
            color: #c7254e;
        }

        .article-content pre {
            margin: 16px 0;
            padding: 16px 20px;
            background: #282c34;
            border-radius: var(--radius);
            overflow-x: auto;
        }

        .article-content pre code {
            padding: 0;
            background: none;
            color: #abb2bf;
            font-size: 14px;
            line-height: 1.6;
        }

        .article-content hr {
            border: none;
            height: 1px;
            background: var(--color-border);
            margin: 28px 0;
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
        }

        .article-content th, .article-content td {
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            text-align: left;
        }

        .article-content th {
            background: var(--color-blockquote-bg);
            font-weight: 600;
            color: var(--color-heading);
        }

        /* ── 右侧边栏 ── */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            position: sticky;
            top: calc(var(--header-height) + 20px);
        }

        .sidebar-card {
            background: var(--color-bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 20px;
            margin-bottom: 16px;
        }

        .sidebar-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-heading);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }

        .sidebar-card .site-desc {
            font-size: 13px;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        .article-list {
            list-style: none;
        }

        .article-list li + li {
            border-top: 1px solid var(--color-border);
        }

        .article-list a {
            display: block;
            padding: 12px 0;
            text-decoration: none;
        }

        .article-list a:hover .article-list-title {
            color: var(--color-primary);
        }

        .article-list .article-list-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s;
        }

        .article-list .article-list-date {
            font-size: 12px;
            color: var(--color-text-tertiary);
            margin-top: 4px;
        }

        .article-list .current-article .article-list-title {
            color: var(--color-primary);
            font-weight: 600;
        }

        /* ── 页脚 ── */
        .site-footer {
            text-align: center;
            padding: 32px 24px;
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .site-footer a {
            color: var(--color-text-secondary);
            text-decoration: none;
        }

        .site-footer a:hover {
            color: var(--color-primary);
        }

        .back-to-top {
            display: inline-block;
            margin-top: 8px;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 4px 12px;
            border-radius: 14px;
            transition: all 0.2s;
        }

        .back-to-top:hover {
            color: var(--color-primary);
            background: var(--color-primary-light);
        }

        /* ── 响应式 ── */
        @media (max-width: 960px) {
            .page-container {
                flex-direction: column;
                margin: 12px auto 32px;
            }

            .sidebar {
                width: 100%;
                position: static;
            }

            .article-main {
                padding: 24px 20px 32px;
            }

            .article-meta h1 {
                font-size: 22px;
            }

            .article-content h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="https://bjting.com"><img src="/logo.png" alt="白洁听书">白洁听书</a>
        <a class="back-link" href="https://bjting.com">← 返回主站</a>
    </header>

    <main class="page-container">
        <article class="article-main">
            <div class="article-meta">
                <h1>{{title}}</h1>
                <div class="meta-info">
                    <span>{{date}}</span>
                    {{tags_html}}
                </div>
            </div>
            <div class="article-content">
                {{content}}
            </div>
        </article>

        <aside class="sidebar">
            <div class="sidebar-card">
                <h3>关于白洁听书</h3>
                <p class="site-desc">白洁听书是一个有声小说平台，为你带来优质的听书体验。</p>
            </div>
            <div class="sidebar-card">
                <h3>历史文章</h3>
                <ul class="article-list" id="articleList"></ul>
            </div>
        </aside>
    </main>

    <footer class="site-footer">
        <p>&copy; {{year}} <a href="https://bjting.com">白洁听书 bjting.com</a></p>
        <span class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到顶部</span>
    </footer>

    <script>
        var ARTICLE_INDEX = {{article_index_json}};
        var CURRENT_SLUG = '{{slug}}';

        (function () {
            var list = document.getElementById('articleList');
            if (!ARTICLE_INDEX || !ARTICLE_INDEX.length) return;
            var html = '';
            for (var i = 0; i < ARTICLE_INDEX.length; i++) {
                var a = ARTICLE_INDEX[i];
                var isCurrent = a.slug === CURRENT_SLUG;
                html += '<li class="' + (isCurrent ? 'current-article' : '') + '">'
                    + '<a href="/article/' + a.slug + '">'
                    + '<div class="article-list-title">' + a.title + '</div>'
                    + '<div class="article-list-date">' + a.date + '</div>'
                    + '</a></li>';
            }
            list.innerHTML = html;
        })();
    </script>
</body>
</html>
