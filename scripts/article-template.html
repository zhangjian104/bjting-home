<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - 北极听</title>
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://bjting.com/article/{{slug}}">
    <meta property="og:image" content="{{cover}}">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root {
            --content-max-width: 780px;
            --sidebar-width: 300px;
            --gap: 32px;
            --header-height: 56px;
            --color-bg: #ffffff;
            --color-bg-secondary: #f6f8fa;
            --color-border: #e5e7eb;
            --color-text: #1f2937;
            --color-text-secondary: #6b7280;
            --color-primary: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
                         sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        /* 顶部导航 */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .site-header .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: var(--color-text);
            text-decoration: none;
        }

        .site-header .logo img {
            height: 28px;
            width: 28px;
            border-radius: 6px;
        }

        .site-header .back-link {
            margin-left: auto;
            font-size: 14px;
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .site-header .back-link:hover {
            color: var(--color-primary);
        }

        /* 主体两栏布局 */
        .page-container {
            max-width: calc(var(--content-max-width) + var(--sidebar-width) + var(--gap));
            margin: 0 auto;
            padding: 32px 24px 64px;
            display: flex;
            gap: var(--gap);
            align-items: flex-start;
        }

        /* 文章正文 */
        .article-main {
            flex: 1;
            min-width: 0;
            max-width: var(--content-max-width);
        }

        .article-meta {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--color-border);
        }

        .article-meta h1 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 12px;
        }

        .article-meta .meta-info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .article-meta .meta-info .tag {
            display: inline-block;
            padding: 2px 10px;
            background: var(--color-bg-secondary);
            border-radius: 12px;
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .markdown-body {
            font-size: 16px;
        }

        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
        }

        /* 右侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            position: sticky;
            top: calc(var(--header-height) + 32px);
        }

        .sidebar-card {
            background: var(--color-bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .sidebar-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text);
        }

        .sidebar-card .site-desc {
            font-size: 13px;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        .article-list {
            list-style: none;
        }

        .article-list li {
            border-bottom: 1px solid var(--color-border);
        }

        .article-list li:last-child {
            border-bottom: none;
        }

        .article-list a {
            display: block;
            padding: 10px 0;
            text-decoration: none;
            transition: background 0.15s;
        }

        .article-list a:hover .article-list-title {
            color: var(--color-primary);
        }

        .article-list .article-list-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s;
        }

        .article-list .article-list-date {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        .article-list .current-article .article-list-title {
            color: var(--color-primary);
            font-weight: 600;
        }

        /* 页脚 */
        .site-footer {
            text-align: center;
            padding: 32px 24px;
            font-size: 13px;
            color: var(--color-text-secondary);
            border-top: 1px solid var(--color-border);
        }

        .site-footer a {
            color: var(--color-text-secondary);
            text-decoration: none;
        }

        .site-footer a:hover {
            color: var(--color-primary);
        }

        .back-to-top {
            display: inline-block;
            margin-top: 8px;
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: color 0.2s;
        }

        .back-to-top:hover {
            color: var(--color-primary);
        }

        /* 响应式：窄屏时侧边栏移到正文下方 */
        @media (max-width: 900px) {
            .page-container {
                flex-direction: column;
                padding: 20px 16px 48px;
            }

            .sidebar {
                width: 100%;
                position: static;
            }

            .article-meta h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="https://bjting.com"><img src="/logo.png" alt="白洁听书">白洁听书</a>
        <a class="back-link" href="https://bjting.com">← 返回主站</a>
    </header>

    <main class="page-container">
        <article class="article-main">
            <div class="article-meta">
                <h1>{{title}}</h1>
                <div class="meta-info">
                    <span>{{date}}</span>
                    {{tags_html}}
                </div>
            </div>
            <div class="markdown-body">
                {{content}}
            </div>
        </article>

        <aside class="sidebar">
            <div class="sidebar-card">
                <h3>关于北极听</h3>
                <p class="site-desc">北极听是一个有声小说平台，为你带来优质的听书体验。</p>
            </div>
            <div class="sidebar-card">
                <h3>历史文章</h3>
                <ul class="article-list" id="articleList"></ul>
            </div>
        </aside>
    </main>

    <footer class="site-footer">
        <p>&copy; {{year}} <a href="https://bjting.com">北极听 bjting.com</a></p>
        <span class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到顶部</span>
    </footer>

    <script>
        var ARTICLE_INDEX = {{article_index_json}};
        var CURRENT_SLUG = '{{slug}}';

        (function () {
            var list = document.getElementById('articleList');
            if (!ARTICLE_INDEX || !ARTICLE_INDEX.length) return;
            var html = '';
            for (var i = 0; i < ARTICLE_INDEX.length; i++) {
                var a = ARTICLE_INDEX[i];
                var isCurrent = a.slug === CURRENT_SLUG;
                html += '<li class="' + (isCurrent ? 'current-article' : '') + '">'
                    + '<a href="/article/' + a.slug + '">'
                    + '<div class="article-list-title">' + a.title + '</div>'
                    + '<div class="article-list-date">' + a.date + '</div>'
                    + '</a></li>';
            }
            list.innerHTML = html;
        })();
    </script>
</body>
</html>
